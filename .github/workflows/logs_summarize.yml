name: "Logs: Summarize & update sheet"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'last7 (optional; if set, runs last 7 days; otherwise runs daily)'
        required: false
        default: ''
      date:
        description: 'YYYY-MM-DD for daily mode (default: yesterday Europe/Rome)'
        required: false
        default: ''
  schedule:
    # DST-safe: 06:00 Europe/Rome is 05:00 UTC in winter, 04:00 UTC in summer.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'

concurrency:
  group: logs-summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # gate so scheduled triggers only execute at 06:00 Europe/Rome
      - name: Gate to 06:00 Europe/Rome on schedule
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        run: |
          hour=$(TZ=Europe/Rome date +%H)
          if [ "$hour" = "06" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Not 06:00 Europe/Rome (hour=$hour). Skipping."
          fi

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Decide what to run:
      # - scheduled: always DAILY (yesterday, Europe/Rome)
      # - manual: if mode == 'last7' then LAST7 else DAILY (date input or yesterday)
      - name: Decide target day (daily mode only)
        id: when
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true' }}
        run: |
          # default: daily yesterday in Europe/Rome
          day=$(TZ=Europe/Rome date -d 'yesterday' +%F)
          # manual override
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date }}" ]; then
            if [[ "${{ github.event.inputs.date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              day="${{ github.event.inputs.date }}"
            else
              echo "Provided date is not YYYY-MM-DD; falling back to yesterday."
            fi
          fi
          echo "day=$day" >> $GITHUB_OUTPUT
          echo "Daily target day: $day"

      # DAILY: always on schedule; on manual unless mode == 'last7'
      - name: Run summarizer (daily)
        if: ${{ steps.gate.outputs.run == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'last7') }}
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          LOGS_DATE:  ${{ steps.when.outputs.day }}
        run: python summarize_log_counts.py

      # LAST7: only when manually requested with mode == 'last7'
      - name: Run summarizer (last 7 days - manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'last7' }}
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: python summarize_last_7_days.py
